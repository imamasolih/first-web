<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DON's Kebab Menu</title>
    <meta
      name="description"
      content="Browse DON's menu categories and meals."
    />
    <link rel="icon" href="assets/img/logos/dons.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/menu-page.css" />
    <link rel="stylesheet" href="assets/css/mobile-resolution.css" />
    <link rel="stylesheet" href="assets/css/tablet-resolution.css" />
    <link rel="stylesheet" href="assets/css/menu-page-mobile.css" />

  </head>
  <body class="menu-page-body">
    <div id="header-section" data-include="partials/header.html"></div>

    <main class="menu-page-main">
      <section class="menu-page">
        <div class="menu-container">
          <div class="menu-page-layout">
            <button class="menu-sidebar-toggle-mobile" id="menu-sidebar-toggle" aria-label="Toggle menu categories" aria-expanded="false" aria-controls="menu-categories">
                  <svg class="menu-sidebar-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 6h18M3 12h18M3 18h18" />
                  </svg>
                </button>
            <aside class="menu-page-sidebar card" id="menu-sidebar" aria-label="Menu categories">
              <div class="menu-sidebar-container">
                <div class="menu-sidebar-header">
                  <h1 class="menu-page-title">Menu Categories</h1>
                </div>
                <hr class="menu-devider" style="color: #E6E2DD;"/>
                <div
                  id="menu-categories"
                  class="menu-page-categories"
                  role="tablist"
                  aria-label="Menu categories"
                ></div>
              </div>
            </aside>

            <section class="menu-page-content" aria-live="polite">
              <div class="menu-page-header">
                <h2 id="menu-active-category" class="menu-active-category">
                  Menu
                </h2>
                <div class="hero-partners-container">
                  <div class="delivery-partners">
                    <h3 class="delivery-title">Order for Delivery</h3>
                    
                    <div class="partner-grid">
                      <a href="#" class="partner-link" aria-label="Order on Foodora">
                        <img src="assets/img/logos/foodora.png" class="partner-icon" alt="Foodora">
                      </a>
<!-- 
                      <a href="#" class="partner-link" aria-label="Order on Wolt">
                        <img src="assets/img/logos/wolt.svg" class="partner-icon" alt="Wolt">
                        <span class="partner-label">Wolt</span> -->
                      <!-- </a> -->

                      <a href="#" class="partner-link" aria-label="Order on Bolt">
                        <img src="assets/img/logos/bolt.webp" class="partner-icon" alt="Bolt Food">
                      </a>
                    </div>
                  </div>
                </div>
              </div>
              <p id="menu-state" class="menu-page-state is-loading" role="status">
                Loading menu...
              </p>
              <div
                id="menu-items-grid"
                class="menu-items-grid"
                aria-label="Menu items"
              ></div>
            </section>
          </div>
        </div>
      </section>

      <section class="section footer-section" id="contact">
        <div id="footer-section" data-include="partials/menu-footer.html"></div>
      </section>
    </main>

    <script src="assets/js/main.js" async defer></script>
    <script src="assets/js/menu.js" defer></script>
  </body>
</html>
